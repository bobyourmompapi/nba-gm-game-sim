<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite NBA GM Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>GM ELITE <span style="font-weight: 300;">/</span> SIM</h1>
            <div id="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">FRANCHISE</span>
                    <span class="stat-value" id="team-name">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">CAP SPACE</span>
                    <span class="stat-value" id="budget">$0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">RECORD</span>
                    <span class="stat-value" id="record">0 - 0</span>
                </div>
            </div>
        </header>

        <section id="setup-screen" class="screen">
            <h2>BUILD YOUR LEGACY</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">The greatest icons of basketball history are waiting for your leadership.</p>
            <div class="input-group">
                <input type="text" id="city-input" placeholder="Enter Franchise City (e.g. Gotham)">
                <button id="start-game-btn" class="btn-primary">Initialize</button>
            </div>
        </section>

        <section id="main-screen" class="screen hidden">
            <nav>
                <button class="nav-btn active" data-target="roster-view">ROSTER</button>
                <button class="nav-btn" data-target="market-view">TRADE MARKET</button>
                <button class="nav-btn" data-target="schedule-view">SIMULATOR</button>
            </nav>

            <div id="roster-view" class="tab-content">
                <div class="player-list" id="roster-list"></div>
            </div>

            <div id="market-view" class="tab-content hidden">
                <div class="player-list" id="market-list"></div>
            </div>

            <div id="schedule-view" class="tab-content hidden">
                <div class="dashboard-grid">
                    <div class="sim-container">
                        <h3>NEXT MATCHUP</h3>
                        <div id="matchup-info" style="margin: 20px 0; font-size: 1.2rem; text-align: center;">
                            <span id="home-team">YOU</span> vs <span id="away-team">OPPONENT</span>
                        </div>
                        <button id="sim-game-btn" class="btn-primary" style="width: 100%;">SIMULATE GAME</button>
                        <div id="game-log">
                            <div class="log-entry">Awaiting game start...</div>
                        </div>
                    </div>
                    
                    <div class="team-summary">
                        <h3>FRANCHISE RATINGS</h3>
                        <div class="stat-item" style="margin-top: 15px;">
                            <span class="stat-label">OFFENSIVE RATING</span>
                            <span class="stat-value" id="off-rating">0</span>
                        </div>
                        <div class="stat-item" style="margin-top: 15px;">
                            <span class="stat-label">DEFENSIVE RATING</span>
                            <span class="stat-value" id="def-rating">0</span>
                        </div>
                        <div class="stat-item" style="margin-top: 15px;">
                            <span class="stat-label">TEAM CHEMISTRY</span>
                            <span class="stat-value" id="chem-rating">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="game.js"></script>
</body>
</html>
